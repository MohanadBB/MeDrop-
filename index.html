<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MedDrop helps households in the UAE return unused and expired medicines safely: register your medicines, get disposal advice, find a collection point and track your return.">
  <title>MedDrop – Safe Medicine Return</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Presentation layer (report §18): one shell, three role-based portals -->
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="#home" aria-label="MedDrop home">
        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
          <path d="M17 2c6 8 11 13.5 11 19.5A11 11 0 0 1 6 21.5C6 15.5 11 10 17 2z" fill="#4fc3a1"/>
          <path d="M17 2c6 8 11 13.5 11 19.5A11 11 0 0 1 17 32.5z" fill="#2fa784"/>
          <rect x="14.5" y="15" width="5" height="13" rx="1.2" fill="#fff"/>
          <rect x="10.5" y="19" width="13" height="5" rx="1.2" fill="#fff"/>
        </svg>
        <span>MedDrop<small id="portalName">Safe medicine return</small></span>
      </a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site">
    <div class="wrap">
      <span>© 2026 MedDrop · Safe medicine return for the United Arab Emirates</span>
      <span>Collection points shown are sample locations for this prototype.</span>
    </div>
  </footer>

  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="modal"></div>

  <script src="js/models.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ai-api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
